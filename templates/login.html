<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static',
                           filename='style.css') }}">

</head>

<body class="auth-page">

<div class="auth-container">

    <div class="auth-card">

        <h1>
            Welcome Back
        </h1>

        <form method="POST">

            <input type="email"
                   name="email"
                   placeholder="Email"
                   required>

            <input type="password"
                   name="password"
                   placeholder="Password"
                   required>

            <button type="submit">

                Login

            </button>

        </form>

        <p>

            Don't have an account?

            <a href="/register">
                Register
            </a>

        </p>

    </div>

</div>

</body>
</html>
